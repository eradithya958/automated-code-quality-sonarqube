# SonarQube Project Configuration
sonar.projectKey=network-telemetry-engine
sonar.projectName=Network Telemetry and Slice Quality Engine
sonar.projectVersion=1.0.0

# Source & Test paths
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Test Coverage report path
sonar.python.coverage.reportPaths=coverage.xml

# Server connection (defaults to local; override via SONAR_HOST_URL and SONAR_TOKEN)
sonar.host.url=http://localhost:9000
# sonar.login=<set-via-SONAR_TOKEN-env-or-cli>

